<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Motor Kalite Kontrol Sınavı</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1f5f9;color:#1e293b}
model-viewer{width:100%;height:100%;position:absolute;inset:0;z-index:1}
.hotspot{background:#ef4444;border:2px solid white;border-radius:50%;width:18px;height:18px;box-shadow:0 0 10px #ef4444;pointer-events:none}
.hotspot.found{background:#10b981;box-shadow:0 0 12px #10b981}
#giris-ekrani{position:fixed;inset:0;background:linear-gradient(135deg,#f8fafc,#cbd5e1);display:flex;justify-content:center;align-items:center;z-index:1000;padding:20px}
.hero-card{background:#fffffff5;padding:30px;border-radius:22px;box-shadow:0 20px 40px #94a3b859;max-width:450px;width:100%;text-align:center}
.hero-card h1{font-size:24px;color:#0f172a}
.hero-card p{font-size:13px;color:#64748b}
.form-group{text-align:left;margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.form-group input{width:100%;padding:11px;border-radius:9px;border:1px solid #cbd5e1;font-size:15px}
#basla-btn{background:#2563eb;color:white;border:0;padding:14px;border-radius:10px;font-size:16px;font-weight:700;width:100%;cursor:pointer}
#top-header{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:10;background:#fffffff0;padding:10px 18px;border-radius:24px;font-size:13px;font-weight:700;white-space:nowrap}
#admin-login-btn{position:fixed;top:12px;right:12px;z-index:20;background:white;border:1px solid #cbd5e1;padding:9px;border-radius:10px}
#bottom-status-bar{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:10;background:#fffffff2;padding:12px 16px;border-radius:16px;display:flex;align-items:center;gap:18px;white-space:nowrap}
#bitir-btn{background:#10b981;color:white;border:0;padding:10px 14px;border-radius:9px;font-weight:700}
#panel{position:fixed;top:65px;left:-420px;z-index:15;background:white;padding:18px;border-radius:14px;width:380px;max-width:calc(100% - 24px);max-height:calc(100% - 90px);overflow:auto;transition:left .3s}
#panel.open{left:12px}
table{width:100%;border-collapse:collapse;font-size:11px}
td,th{padding:6px;border-bottom:1px solid #e2e8f0;text-align:left}
.panel-btn{width:100%;padding:10px;margin-top:8px;border:0;border-radius:8px;color:white;font-weight:700}
#bildirim{display:none;position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#059669;color:white;padding:13px 20px;border-radius:12px;font-weight:800;z-index:999;text-align:center;max-width:90%}
#qr-modal{display:none;position:fixed;inset:0;background:#0009;z-index:2000;justify-content:center;align-items:center}
.qr-card{background:white;padding:25px;border-radius:18px;text-align:center;max-width:90%}
@media(max-width:600px){
 .hero-card{padding:24px 18px}
 .hero-card h1{font-size:21px}
 #top-header{left:10px;transform:none;top:10px;font-size:11px;padding:9px;max-width:calc(100% - 145px);overflow:hidden}
 #admin-login-btn{top:10px;right:8px;font-size:11px}
 #bottom-status-bar{bottom:8px;width:calc(100% - 16px);justify-content:space-between;gap:8px;padding:10px;font-size:12px}
 #panel{left:-110%;width:calc(100% - 24px)}
 #panel.open{left:12px}
}
</style>
</head>
<body>

<model-viewer id="engine-viewer" src="motor11-v1.glb" alt="3D Motor Modeli"
 camera-controls shadow-intensity="1.5" touch-action="pan-y">
</model-viewer>

<div id="giris-ekrani">
 <div class="hero-card">
  <h1>3D Motor Muayene Sınavı</h1>
  <p>Sınava başlamak için bilgilerinizi doldurun. Her arıza 10 puan.</p>
  <form id="kayit-form">
   <div class="form-group"><label for="input-ad">Adınız</label><input id="input-ad" required></div>
   <div class="form-group"><label for="input-soyad">Soyadınız</label><input id="input-soyad" required></div>
   <div class="form-group"><label for="input-bolum">Bölüm / Departman</label><input id="input-bolum" required></div>
   <div class="form-group"><label for="input-sicil">Sicil No</label><input id="input-sicil" required></div>
   <div id="form-error" style="display:none;color:#dc2626;font-size:12px;margin:8px">Bu sicil numarasıyla daha önce sınava girilmiş.</div>
   <button type="submit" id="basla-btn">Sınavı Başlat 🚀</button>
  </form>
 </div>
</div>

<div id="top-header">🔍 3D Motor Kalite Kontrol Sınavı</div>
<button id="admin-login-btn">🔒 Yönetici</button>
<div id="bottom-status-bar">
 <span>Arıza: <b id="progress-text">0 / 10</b></span>
 <button id="bitir-btn">Sınavı Bitir 🏁</button>
</div>

<div id="panel">
 <h3>Kayıtlı Sınav Sonuçları</h3>
 <table><thead><tr><th>Sicil</th><th>Ad Soyad</th><th>Bölüm</th><th>Puan</th><th>Durum</th></tr></thead><tbody id="results-tbody"></tbody></table>
 <button class="panel-btn" style="background:#059669" id="excel-export-btn">Sonuçları CSV İndir</button>
 <button class="panel-btn" style="background:#0284c7" id="qr-generate-btn">Sınav QR Kodu Oluştur</button>
 <div id="status" style="font-size:11px;margin-top:10px"></div>
</div>

<div id="qr-modal">
 <div class="qr-card">
  <button id="qr-close-btn">Kapat ✕</button>
  <h3>Sınav QR Kodu</h3>
  <div id="qrcode-container"></div>
  <div id="qr-link-text" style="font-size:10px;word-break:break-all"></div>
  <button id="qr-download-btn">QR Kodu İndir</button>
 </div>
</div>
<div id="bildirim" role="status" aria-live="polite"></div>

<script>
const viewer = document.getElementById('engine-viewer');
const TOPLAM_ARIZA = 10;
const ARIZA_PUANI = 10;
const BASARI_BARAJI = 70;

let aktifKullanici = null;
let hotspotCounter = 0;
let touchStart = null;
let isHandlingFaultTap = false;
let testKayitlari = [];

try {
 testKayitlari = JSON.parse(localStorage.getItem('engine_test_results') || '[]');
 if (!Array.isArray(testKayitlari)) testKayitlari = [];
} catch(e) { testKayitlari = []; }

const hataliBolgeler = [
 {id:1,x:0.314,y:0.268,z:-0.093,bulundu:false},
 {id:2,x:0.315,y:0.175,z:-0.033,bulundu:false},
 {id:3,x:0.313,y:0.243,z:0.072,bulundu:false},
 {id:4,x:-0.371,y:0.803,z:-0.087,bulundu:false},
 {id:5,x:0.314,y:0.332,z:-0.042,bulundu:false},
 {id:6,x:-0.267,y:0.871,z:0.081,bulundu:false},
 {id:7,x:-0.352,y:0.738,z:0.312,bulundu:false},
 {id:8,x:-0.375,y:0.801,z:-0.094,bulundu:false},
 {id:9,x:-0.373,y:0.794,z:0.074,bulundu:false}
];

function ilerlemeyiGuncelle(){
 const sayi=hataliBolgeler.filter(h=>h.bulundu).length;
 document.getElementById('progress-text').textContent=`${sayi} / ${TOPLAM_ARIZA}`;
}

let bildirimTimer;
function bildirimGoster(metin){
 const el=document.getElementById('bildirim');
 el.textContent=metin;
 el.style.display='block';
 clearTimeout(bildirimTimer);
 bildirimTimer=setTimeout(()=>el.style.display='none',1800);
}

document.getElementById('kayit-form').addEventListener('submit',e=>{
 e.preventDefault();
 const sicil=document.getElementById('input-sicil').value.trim();
 const varMi=testKayitlari.some(k=>String(k.sicil).toLowerCase()===sicil.toLowerCase());
 if(varMi){document.getElementById('form-error').style.display='block';return;}
 document.getElementById('form-error').style.display='none';

 aktifKullanici={
  ad:document.getElementById('input-ad').value.trim(),
  soyad:document.getElementById('input-soyad').value.trim(),
  bolum:document.getElementById('input-bolum').value.trim(),
  sicil,puan:0,durum:'BAŞARISIZ',
  tarih:new Date().toLocaleString('tr-TR')
 };

 hataliBolgeler.forEach(h=>h.bulundu=false);
 document.querySelectorAll('.hotspot').forEach(el=>el.remove());
 hotspotCounter=0;
 ilerlemeyiGuncelle();
 document.getElementById('giris-ekrani').style.display='none';
});

// Dokunma konumunu doğrudan viewer alanı içinde hesaplar.
const TIKLAMA_YARICAPI = 38;

function ekranaYansit(hata){
 const rect=viewer.getBoundingClientRect();
 const canvas=viewer.shadowRoot?.querySelector('canvas');
 if(!canvas) return null;

 // model-viewer'ın gerçek kamera projeksiyonunu kullan.
 try {
  const p=viewer.toScreenCoordinates({x:hata.x,y:hata.y,z:hata.z});
  if(p && Number.isFinite(p.x) && Number.isFinite(p.y)){
   // toScreenCoordinates bazı sürümlerde canvas koordinatı döndürebilir.
   const cr=canvas.getBoundingClientRect();
   const sx=p.x*(cr.width/(canvas.width||cr.width));
   const sy=p.y*(cr.height/(canvas.height||cr.height));
   return {x:cr.left-rect.left+sx,y:cr.top-rect.top+sy};
  }
 } catch(e) {}
 return null;
}

async function handleFaultTap(clientX,clientY){
 if(!aktifKullanici || isHandlingFaultTap) return;
 isHandlingFaultTap=true;

 try{
  const rect=viewer.getBoundingClientRect();
  const tapX=clientX-rect.left;
  const tapY=clientY-rect.top;
  let enYakin=null;
  let enKucuk=Infinity;

  for(const hata of hataliBolgeler){
   if(hata.bulundu) continue;
   const p=ekranaYansit(hata);
   if(!p) continue;

   const d=Math.hypot(tapX-p.x,tapY-p.y);
   if(d<TIKLAMA_YARICAPI && d<enKucuk){
    enYakin=hata;
    enKucuk=d;
   }
  }

  if(!enYakin){
   bildirimGoster('Bu noktada arıza bulunamadı.');
   return;
  }

  enYakin.bulundu=true;
  hotspotCounter++;

  const marker=document.createElement('div');
  marker.slot=`hotspot-${hotspotCounter}`;
  marker.className='hotspot found';
  marker.setAttribute('data-position',`${enYakin.x}m ${enYakin.y}m ${enYakin.z}m`);
  marker.setAttribute('data-normal','0m 1m 0m');
  viewer.appendChild(marker);

  bildirimGoster('⚠️ Arıza Bulundu! (+10 Puan)');
  ilerlemeyiGuncelle();
 } finally {
  isHandlingFaultTap=false;
 }
}

// pointer olayları dokunma ve fare için kullanılır.
viewer.addEventListener('pointerdown',e=>{
 if(!aktifKullanici) return;
 if(e.pointerType==='mouse' && e.button!==0) return;
 touchStart={x:e.clientX,y:e.clientY,time:Date.now(),id:e.pointerId};
},{passive:true});

viewer.addEventListener('pointerup',e=>{
 if(!touchStart || touchStart.id!==e.pointerId){touchStart=null;return;}
 const s=touchStart;
 touchStart=null;
 const hareket=Math.hypot(e.clientX-s.x,e.clientY-s.y);
 if(hareket>18 || Date.now()-s.time>1500) return;
 handleFaultTap(e.clientX,e.clientY);
},{passive:true});

viewer.addEventListener('pointercancel',()=>touchStart=null);

document.getElementById('bitir-btn').addEventListener('click',()=>{
 if(!aktifKullanici){alert('Önce sınavı başlatın.');return;}
 const sayi=hataliBolgeler.filter(h=>h.bulundu).length;
 aktifKullanici.puan=sayi*ARIZA_PUANI;
 aktifKullanici.durum=aktifKullanici.puan>=BASARI_BARAJI?'BAŞARILI':'BAŞARISIZ';
 testKayitlari.push({...aktifKullanici});
 try{localStorage.setItem('engine_test_results',JSON.stringify(testKayitlari));}catch(e){}
 tabloyuCiz();
 alert(`Sınav tamamlandı!\nBulunan arıza: ${sayi}\nPuan: ${aktifKullanici.puan}\nDurum: ${aktifKullanici.durum}`);
 location.reload();
});

document.getElementById('admin-login-btn').addEventListener('click',()=>{
 if(prompt('Yönetici şifresi:')==='admin2026'){
  document.getElementById('panel').classList.toggle('open');
 }else alert('Hatalı şifre!');
});

function tabloyuCiz(){
 const tbody=document.getElementById('results-tbody');
 tbody.innerHTML='';
 testKayitlari.forEach(k=>{
  const tr=document.createElement('tr');
  [k.sicil,`${k.ad} ${k.soyad}`,k.bolum,k.puan,k.durum].forEach((v,i)=>{
   const td=document.createElement('td');
   td.textContent=v??'';
   if(i===4)td.style.color=k.puan>=BASARI_BARAJI?'#15803d':'#b91c1c';
   tr.appendChild(td);
  });
  tbody.appendChild(tr);
 });
}

document.getElementById('excel-export-btn').addEventListener('click',()=>{
 if(!testKayitlari.length){alert('Kayıt yok.');return;}
 const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 let csv='\uFEFFSicil;Ad;Soyad;Bölüm;Puan;Durum;Tarih\n';
 testKayitlari.forEach(k=>{
  csv+=[k.sicil,k.ad,k.soyad,k.bolum,k.puan,k.durum,k.tarih].map(esc).join(';')+'\n';
 });
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
 const a=document.createElement('a');
 a.href=url;a.download='Sinav_Sonuclari.csv';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});

document.getElementById('qr-generate-btn').addEventListener('click',()=>{
 if(typeof QRCode==='undefined'){alert('QR kütüphanesi yüklenemedi.');return;}
 const box=document.getElementById('qrcode-container');
 box.innerHTML='';
 new QRCode(box,{text:location.href,width:180,height:180});
 document.getElementById('qr-link-text').textContent=location.href;
 document.getElementById('qr-modal').style.display='flex';
});
document.getElementById('qr-close-btn').addEventListener('click',()=>document.getElementById('qr-modal').style.display='none');
document.getElementById('qr-download-btn').addEventListener('click',()=>{
 const box=document.getElementById('qrcode-container');
 const img=box.querySelector('img');
 const canvas=box.querySelector('canvas');
 const url=img?.src||(canvas?canvas.toDataURL('image/png'):null);
 if(!url){alert('Önce QR kodu oluşturun.');return;}
 const a=document.createElement('a');a.href=url;a.download='Sinav_QR.png';a.click();
});

viewer.addEventListener('load',()=>document.getElementById('status').textContent='3D model yüklendi.');
viewer.addEventListener('error',()=>document.getElementById('status').textContent='Model yüklenemedi. motor11-v1.glb dosyasını kontrol edin.');
tabloyuCiz();
ilerlemeyiGuncelle();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Motor Görüntüleyici</title>
    <!-- Google Model Viewer Standart Kütüphanesi -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f1f5f9; }
        model-viewer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <!-- Doğrudan siteye giren herkesin ekranında açılacak model -->
    <model-viewer 
        src="motor10.glb" 
        alt="3D Motor Modeli" 
        auto-rotate 
        camera-controls 
        ar>
    </model-viewer>

</body>
</html>
